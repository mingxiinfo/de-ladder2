apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample
spec:
  parentRefs:
    - name: public          # 只对内网开放的应用改成 internal（docs/18）
      namespace: gateway
  hostnames:
    - sample.example.com      # 各环境在 overlay 里改
  rules:
    - backendRefs:
        - name: sample
          port: 80
