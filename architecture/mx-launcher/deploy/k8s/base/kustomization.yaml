apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 分流 DNS 在另一个命名空间 mx-dns，放在 ../dns/，所以命名空间写在这里而不是 overlay 里
namespace: mx-internal-shadow
resources:
  - postgres.yaml
  - api.yaml
  - app-gateway.yaml
  - host-runner.yaml
  - route.yaml
# 配置改了名字就变，API 跟着滚动更新
configMapGenerator:
  - name: mx-launcher-internal-config
    envs:
      - config.env
labels:
  - pairs:
      ladder2/project: mx-launcher
    includeSelectors: false
