# 分流 DNS（mx-internal-coredns），命名空间 mx-dns，名字沿用 L1（docs/47）。
# Corefile 的 ConfigMap 在 ../bootstrap/：它归 Launcher 运行时改写（管理界面的 DNS 页面），app apply 不覆盖。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mx-dns
resources:
  - coredns.yaml
  - rbac.yaml
labels:
  - pairs:
      ladder2/project: mx-launcher
    includeSelectors: false
