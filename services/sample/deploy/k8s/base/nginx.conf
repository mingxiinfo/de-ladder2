# 样板服务（docs/35）：不访问数据库，只回固定内容，用来量"入口到 Pod"这一段能扛多少。
# /whoami 回显网关传过来的客户端地址，node verify s2 sample 用它检查网关认对了客户端（docs/05、docs/35）。
# 整份 nginx.conf 自己写：镜像默认的 worker_processes auto 会按宿主机的核数起进程，在大机器上几百个。
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    # 压测时每秒上千行日志本身就是开销。请求编号在 host-nginx 那层记（docs/26）。
    access_log off;
    keepalive_timeout 65s;
    keepalive_requests 100000;
    server {
        listen 8080;
        server_name _;
        default_type text/plain;
        location = /healthz { return 200 "ok\n"; }
        location = /readyz  { return 200 "ok\n"; }
        location = /whoami {
            return 200 "remote_addr=$remote_addr\nx_real_ip=$http_x_real_ip\nx_forwarded_for=$http_x_forwarded_for\nx_request_id=$http_x_request_id\nhost=$host\n";
        }
        location / { return 200 "sample\n"; }
    }
}
