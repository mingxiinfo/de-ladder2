# 同一个样板挂在两个 Gateway 上，两个入口都能量（docs/18、docs/35）。
# 真正的业务只对内网开放时只挂 internal。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample
spec:
  parentRefs:
    - name: public
      namespace: gateway
    - name: internal
      namespace: gateway
  hostnames:
    - sample.ladder2.internal   # inventory/probes.yaml 的 sample、sample-internal 用这个域名
  rules:
    - backendRefs:
        - name: sample
          port: 80
