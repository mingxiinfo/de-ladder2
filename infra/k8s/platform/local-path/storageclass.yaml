# 本工程的默认存储类（docs/35）。和上游的 local-path 用同一个 provisioner，区别只在回收策略：
# 上游 local-path 是 Delete，删了 PVC 数据目录跟着删；这里是 Retain，删了 PVC 数据还在磁盘上，要人工清理。
# 数据库都用这个（CLAUDE.md：不删旧数据）。数据目录由 config-patch.json 设成 /data/k8s/storage（docs/16）。
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-retain
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
